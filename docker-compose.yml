# Two services, and one of them deliberately does not talk to the other.
#
# `api` serves BM25 retrieval, grounded generation, and citation verification. `qdrant`
# exists so `ragpipe ann` can reproduce the measurement in reports/ann_recall.md — the
# one that found the vector store costs ~7x the latency of the in-process matrix product
# it would replace at this corpus size, most of it transport. So the API queries numpy,
# not Qdrant, and the store is here as evidence rather than as infrastructure.
#
# Pairing them without saying that would imply the API depends on Qdrant. It does not,
# and the report explains why.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant's own /healthz. `ragpipe ann` additionally blocks on the indexed vector
      # count before measuring, because "the container is up" and "HNSW exists" are
      # different claims and the second is the one the recall numbers depend on.
      # `bash`, not CMD-SHELL. The image ships no curl, wget or nc, so the check has to
      # open the socket itself via /dev/tcp -- which is a bash builtin, and CMD-SHELL
      # runs `sh` (dash here). Written as CMD-SHELL it failed with "cannot create
      # /dev/tcp/...", marking a perfectly healthy Qdrant unhealthy.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Optional. Absent, the service starts retrieval-only and /health reports why.
      # Passed as a variable rather than a mounted .env.gemini so no secret enters an
      # image layer or the build context.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      RAGPIPE_ROOT: /app
      # Unset by design: the free tier bills nothing and no confirmed paid per-token rate
      # was obtained, so /stats reports tokens and a null cost. Set both to have it
      # compute dollars — see src/ragpipe/service.py.
      RAGPIPE_PRICE_IN: "${RAGPIPE_PRICE_IN:-}"
      RAGPIPE_PRICE_OUT: "${RAGPIPE_PRICE_OUT:-}"
    volumes:
      # Read-only, and only the chunks: the service needs the index input and nothing
      # else. Build it first with `make chunk` — this directory is gitignored, so a
      # fresh clone has to generate it rather than receive it.
      - ./data/chunks:/app/data/chunks:ro

volumes:
  qdrant_storage:
